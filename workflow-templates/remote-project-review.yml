name: Validate build

on:
  workflow_dispatch:
    inputs:
      source_pr:
        description: Optional PR number; omitted values discover the current branch and commit
        required: false
        default: ""
        type: string
      profile:
        description: Centrally approved validation profile
        required: false
        default: default
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: project-review-${{ github.ref }}-${{ inputs.profile || 'default' }}
  cancel-in-progress: false

jobs:
  request-validation:
    if: startsWith(github.ref, 'refs/heads/')
    name: Validate build
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-review.yml@a3850ac495dd8d4470ddb745b166ae656c61c5a5
    with:
      profile: ${{ inputs.profile || 'default' }}
      source_pr: ${{ inputs.source_pr }}
