name: Build image

on:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: project-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request-image:
    name: Build image
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-image.yml@a3850ac495dd8d4470ddb745b166ae656c61c5a5
    with:
      profile: default
