name: Build image

on:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: project-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request-image:
    name: Build image
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-image.yml@57ab34c3c62b6a67e88447dac89183dceb61c9a4
    with:
      profile: default
