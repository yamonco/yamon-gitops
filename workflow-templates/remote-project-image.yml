name: Build image

on:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: project-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request-image:
    name: Build image
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-image.yml@e6a6d69c9c87e915abe588ff7a3fa620546b59b7
    with:
      profile: default
