name: Build image

on:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: project-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request-image:
    name: Build image
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-image.yml@684857039c28406259fc64915c2062faa04ebfd6
    with:
      profile: default
